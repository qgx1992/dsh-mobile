<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>连接失败</title>
    <style>
      :root {
        --canvas: #0f141c;
        --surface: #171d27;
        --surface-2: #212936;
        --rule: #2b3442;
        --ink: #e3e6ea;
        --ink-2: #a8b0bd;
        --ink-3: #7b8595;
        --accent: #e0b558;
        --accent-ink: #241c08;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        padding: calc(var(--safe-top) + 40px) 20px calc(var(--safe-bottom) + 24px);
        display: flex; flex-direction: column; justify-content: center;
      }
      .icon {
        width: 56px; height: 56px; border-radius: 16px; margin-bottom: 18px;
        background: var(--surface-2); border: 1px solid var(--rule);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
      p { color: var(--ink-2); margin: 0 0 20px; font-size: 14px; }
      ul { color: var(--ink-3); font-size: 13.5px; margin: 0 0 24px; padding-left: 18px; }
      li { margin-bottom: 5px; }
      button {
        font: inherit; border: 0; border-radius: 8px; cursor: pointer;
        padding: 13px 16px; font-weight: 600; font-size: 15px;
        background: var(--accent); color: var(--accent-ink);
        width: 100%;
      }
      button:active { opacity: .78; }
      .tip { margin-top: 16px; font-size: 12.5px; color: var(--ink-3); text-align: center; }
    </style>
  </head>
  <body>
    <div class="icon">⚡️</div>
    <h1>没连上电脑</h1>
    <p>无法打开刚才的地址。常见原因：</p>
    <ul>
      <li>电脑上的 DSH 没在运行，或「手机访问」是关闭的</li>
      <li>手机和电脑不在同一个 WiFi</li>
      <li>电脑的局域网 IP 变了（换了网络）</li>
      <li>用的是公网地址但隧道已关闭</li>
    </ul>
    <button id="back">返回重新连接</button>
    <p class="tip">可以回到电脑上 DSH 的设置 →「手机访问」，重新扫码或查看当前地址。</p>

    <script>
      document.getElementById('back').addEventListener('click', function () {
        // 回到 App 内置的连接页
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>
